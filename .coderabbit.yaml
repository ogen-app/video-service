# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for ogen-app/video-service (CON-148). The default
# branch carries this file so it applies as the base config on every PR.
language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true

  # Generated protobuf stubs and build output are noise in review.
  path_filters:
    - "!gen/**"
    - "!**/*.pb.go"
    - "!go.sum"

  # Repo-specific review guidance so CodeRabbit enforces this service's
  # conventions rather than generic Go advice.
  path_instructions:
    - path: "internal/**/*.go"
      instructions: >-
        All application logging must go through log/slog (CON-107) — flag any
        stdlib log.Print/Printf/Println calls (boot-time log.Fatal* in cmd/ is
        the only exception). Structured logs should carry a "component" key.
    - path: "internal/server/**/*.go"
      instructions: >-
        gRPC error mapping is load-bearing: input that is genuinely not a
        decodable video must return codes.InvalidArgument (terminal, no client
        retry); transient faults (network, timeout, missing binary) must return
        codes.Internal/DeadlineExceeded so the API degrades gracefully. Flag any
        mapping that could reject a valid upload on a transient error.
    - path: "internal/videoengine/**/*.go"
      instructions: >-
        This package shells out to ffprobe/ffmpeg. Verify every exec.Command is
        context-bound (exec.CommandContext), reads the source URL directly
        (no whole-file buffering), and that the error classifier stays
        conservative — only well-known content-corruption markers are terminal.
    - path: "proto/**/*.proto"
      instructions: >-
        This repo is the canonical home of the video.v1 contract. Treat field
        renumbering, type changes, or removals as breaking — the Ogen API
        consumes a pinned copy of this proto.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main

  tools:
    golangci-lint:
      enabled: true

chat:
  auto_reply: true
