name: ci

# Lint + test on every PR and push. The image is built and pushed only after
# both test jobs (go, proto) pass, and only on main or version tags — never on
# PRs. Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker
# Hub access token).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The engine shells out to ffmpeg/ffprobe; install them so the
      # end-to-end videoengine tests run instead of skipping.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go' | grep -v '^gen/'))"
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi

      # All application logging goes through log/slog (CON-107). Boot log.Fatal*
      # in cmd/video-service is allowed; log.Print/Printf/Println calls are not.
      # Anchored on the call paren so prose mentions of the funcs don't trip it.
      - name: forbid stdlib log.Print calls
        run: |
          if git grep -nE 'log\.Print(ln|f)?\(' -- cmd internal; then
            echo "::error::use log/slog, not the stdlib log.Print/Printf/Println functions"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint proto

  build-push:
    runs-on: ubuntu-latest
    # Gate the image on tests: this job won't start until both go and proto
    # succeed (needs implies success). Skip on PRs and on forks.
    needs: [go, proto]
    if: github.event_name == 'push' && github.repository_owner == 'ogen-app'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/video-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
