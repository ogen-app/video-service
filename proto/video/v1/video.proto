syntax = "proto3";

package video.v1;

// VideoService probes a video for container/codec/duration/resolution
// metadata and captures a poster frame (CON-148). It is the structural
// validator for video uploads — the mirror of pdf-service for PDFs. The
// service is stateless and internal-only, reached by the Ogen API over the
// Railway private network. This repo is the canonical home of the video.v1
// contract; the API consumes a versioned, pinned client.
service VideoService {
  // Probe fetches the video at source_url (a short-lived presigned GET URL)
  // and returns its metadata plus, when render_poster is set, a single
  // representative frame as PNG. Unary: ffprobe/ffmpeg range-read only the
  // bytes they need from the URL, so the API never streams the potentially
  // multi-GB file through its own process — the key difference from
  // pdf-service's byte-streaming Render.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
}

message ProbeRequest {
  // source_url is a short-lived presigned GET URL to the uploaded object in
  // the API's object storage. ffprobe reads it directly (HTTP range).
  string source_url = 1;
  // render_poster also captures a representative frame as PNG.
  bool render_poster = 2;
  // filename is the client-declared name, for logging / container hints only.
  string filename = 3;
}

message ProbeResponse {
  int64 duration_ms = 1; // 0 if unknown
  string codec = 2;      // primary video-stream codec, e.g. "h264", "vp9"
  string container = 3;  // demuxed container, e.g. "mp4", "webm"
  int32 width = 4;       // frame width in pixels, 0 if unknown
  int32 height = 5;      // frame height in pixels, 0 if unknown
  int64 bitrate = 6;     // bits per second, 0 if unknown
  bytes poster_png = 7;  // empty if not requested / capture failed
}
